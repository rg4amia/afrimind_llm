# Copier ce dossier en adapters/<domaine>/ puis lancer : python finetune.py <domaine>
base_model: deepseek-ai/deepseek-coder-1.3b-instruct   # 6.7b-instruct pour un GPU plus gros
quantize: 4bit              # "none" pour entraîner sans quantification
format: chat                # "chat" (template du modèle) ou "completion" (texte brut prompt + completion)
train_file: train.jsonl     # relatif au dossier de l'adaptateur
val_file: null              # optionnel
# Le template de DeepSeek injecte par défaut une consigne « répondre uniquement aux questions d'informatique ».
# Pour tout domaine hors code, définir ici le message système voulu (utilisé aussi à l'inférence).
system_prompt: null         # ex. "Tu es un assistant agricole pour des exploitants d'Afrique de l'Ouest."
max_length: 2048
epochs: 2
batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 0.0002
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
seed: 42
